<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>东京梦华 · 市井浮生</title>
<style>
  :root{
    --paper:#efe6d3; --paper2:#e3d6bd; --ink:#2b2723; --ink2:#5a534a;
    --zhu:#9c3a2e; --yan:#b8574a; --deng:#f0b35a; --wa:#3c4d5a; --zhu2:#7b2f3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d1016;overflow:hidden;
    font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;color:var(--ink)}
  #app{position:fixed;inset:0;overflow:hidden}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1a1f28}

  /* ---------- 全局纸纹 ---------- */
  .paper{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg,rgba(120,100,70,.045) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(90deg,rgba(120,100,70,.035) 0 1px,transparent 1px 6px),
      radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.55),transparent 60%);
    box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(90,70,40,.25);
    border-radius:4px;
  }

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:14px;top:12px;right:14px;display:flex;gap:14px;
       align-items:flex-start;pointer-events:none;z-index:8;flex-wrap:wrap}
  #clock{padding:8px 14px 10px;min-width:210px;pointer-events:auto}
  #clock .row{display:flex;align-items:baseline;gap:8px}
  #date{font-size:19px;letter-spacing:2px}
  #slotname{font-size:14px;color:var(--zhu);letter-spacing:3px}
  #today{font-size:11.5px;color:var(--ink2);letter-spacing:1px;margin-top:5px;opacity:.95}
  #today:empty{display:none}
  .bar{height:4px;background:rgba(90,70,40,.22);border-radius:2px;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--zhu),var(--deng));transition:width .2s linear}
  #attrs{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
  .chip{display:flex;align-items:center;gap:5px;padding:5px 9px;font-size:13px;background:rgba(239,230,211,.92);
        border:1px solid rgba(90,70,40,.35);border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .chip b{font-weight:600;font-size:15px}
  .chip.hot b{color:var(--zhu)}
  #hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;
        padding:6px 16px;font-size:14px;letter-spacing:1px;color:#f4ecdd;background:rgba(30,24,20,.72);
        border:1px solid rgba(240,179,90,.35);border-radius:20px;opacity:0;transition:opacity .18s}
  #hint.on{opacity:1}

  /* ---------- 底栏 ---------- */
  #dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:9;
        flex-wrap:wrap;justify-content:center;max-width:96vw}
  #dock button{font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;
    background:rgba(239,230,211,.94);color:var(--ink);border:1px solid rgba(90,70,40,.45);
    border-radius:3px;padding:7px 13px;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:.12s}
  #dock button:hover{background:#f7f0e1;transform:translateY(-1px)}
  #dock button:active{transform:translateY(1px)}
  #dock button span{opacity:.45;font-size:11px;margin-left:4px}
  #dock button.on{background:var(--zhu);color:#f6ecda;border-color:#6d271e}

  /* ---------- 对话 ---------- */
  #dlg{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 16px 16px;
       display:flex;flex-direction:column;gap:0;pointer-events:none}
  #dlg>*{pointer-events:auto}
  #dbox{padding:14px 20px 16px;position:relative;max-width:1080px;margin:0 auto;width:100%}
  #dhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  #dName{font-size:17px;letter-spacing:2px;color:var(--zhu)}
  #dMeta{font-size:11px;color:var(--ink2);letter-spacing:1px;opacity:.8}
  #dText{font-size:16px;line-height:1.85;letter-spacing:.6px;min-height:62px;white-space:pre-wrap}
  #dText .cur{color:var(--zhu)}
  #dChoices{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  #dChoices button{font-family:inherit;text-align:left;font-size:15px;letter-spacing:1px;cursor:pointer;
    background:linear-gradient(180deg,#f7f0e1,#e9dcc4);color:var(--ink);border:1px solid rgba(156,58,46,.45);
    border-left:4px solid var(--zhu);border-radius:2px;padding:9px 14px;transition:.12s}
  #dChoices button:hover{background:#fdf8ec;border-left-width:7px}
  #dChoices button small{color:var(--zhu);opacity:.85;margin-left:6px;font-size:12px}
  #dNext{position:absolute;right:20px;bottom:10px;font-size:12px;color:var(--zhu);opacity:.7;letter-spacing:2px}

  /* ---------- 面板 ---------- */
  .panel{position:absolute;z-index:22;padding:16px 18px;max-height:78vh;overflow:auto;
    left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,92vw)}
  .panel h3{margin:0 0 10px;font-size:17px;letter-spacing:4px;color:var(--zhu);font-weight:600}
  .panel .close{position:absolute;right:12px;top:10px;cursor:pointer;color:var(--ink2);font-size:13px}
  .hidden{display:none!important}

  .cast{display:flex;flex-direction:column;gap:12px}
  .cast .p{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;
           padding-bottom:10px;border-bottom:1px dashed rgba(90,70,40,.28)}
  .cast .p:last-child{border:none;padding-bottom:0}
  .cast .nm{font-size:15px;letter-spacing:1px}
  .cast .nm i{display:block;font-style:normal;font-size:11px;color:var(--ink2);opacity:.8;margin-top:2px}
  .dim{display:grid;grid-template-columns:38px 1fr 34px;gap:7px;align-items:center;font-size:12px;color:var(--ink2)}
  .dim .b{height:7px;background:rgba(90,70,40,.18);border-radius:4px;overflow:hidden}
  .dim .b>i{display:block;height:100%;width:0;transition:width .3s}
  .dim .v{text-align:right;font-size:11px;letter-spacing:1px}
  .c1>i{background:#5b7355}.c2>i{background:#3c4d5a}.c3>i{background:#b8574a}
  .cast .miss{color:var(--zhu);font-size:12px;margin-top:4px}
  .cast .ok{color:#4f6b4a;font-size:12px;margin-top:4px}
  .cast .nx{font-size:11.5px;color:#6d5c42;line-height:1.7;margin-top:6px;padding-left:7px;border-left:2px solid rgba(140,110,70,.45)}
  .cast .fc{display:block;width:34px;height:40px;object-fit:cover;border-radius:2px;
    border:1px solid rgba(120,96,64,.45);margin:0 0 5px;filter:sepia(.14) saturate(.93) contrast(1.03)}
  .cast .me{display:flex;align-items:center;gap:9px;padding-bottom:9px;
    border-bottom:1px solid rgba(120,96,64,.26)}
  .cast .me .fc{margin:0}
  .cast .me b{font-size:14px;letter-spacing:1px;font-weight:normal;color:var(--ink)}
  .cast .me i{display:block;font-style:normal;font-size:11px;color:var(--ink2);opacity:.85;margin-top:1px}
  @media (max-width: 820px){#dPortrait{width:92px;height:108px}}

  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mgrid button{font-family:inherit;cursor:pointer;padding:14px 10px;font-size:15px;letter-spacing:2px;
    background:linear-gradient(180deg,#f7f0e1,#e6d8bf);border:1px solid rgba(90,70,40,.4);border-radius:3px}
  .mgrid button:hover{background:#fdf8ec}
  .mgrid button.here{border-color:var(--zhu);color:var(--zhu);font-weight:600}
  .mgrid button small{display:block;font-size:11px;color:var(--ink2);letter-spacing:1px;margin-top:4px}

  /* ---------- 卡片/旁白 ---------- */
  #card{position:absolute;z-index:24;left:50%;top:50%;transform:translate(-50%,-50%);
        width:min(560px,90vw);padding:22px 26px;line-height:1.95;font-size:15px;letter-spacing:.5px}
  #card h4{margin:0 0 10px;font-size:16px;letter-spacing:4px;color:var(--zhu)}
  #card .li{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;
            border-bottom:1px dotted rgba(90,70,40,.25)}
  #card .go{margin-top:14px;text-align:right}
  #card button{font-family:inherit;cursor:pointer;padding:7px 18px;background:var(--zhu);color:#f8f0de;
    border:none;border-radius:3px;font-size:14px;letter-spacing:2px}

  /* ---------- 结局卷轴 ---------- */
  #ending{position:absolute;inset:0;z-index:30;background:rgba(10,8,6,.82);display:flex;
          align-items:center;justify-content:center;padding:20px}
  #scroll{width:min(760px,94vw);max-height:88vh;overflow:auto;padding:30px 34px;
          background:linear-gradient(180deg,#f3ead7,#e7dac0);
          border-top:8px solid #6d271e;border-bottom:8px solid #6d271e;
          box-shadow:0 24px 60px rgba(0,0,0,.6)}
  #scroll .seal{width:56px;height:56px;border:2px solid var(--zhu);color:var(--zhu);
    display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:1px;
    line-height:1.1;text-align:center;border-radius:2px;transform:rotate(-4deg);margin-bottom:8px}
  #scroll h2{margin:6px 0 2px;font-size:28px;letter-spacing:6px;font-weight:600}
  #scroll .sub{color:var(--zhu);font-size:13px;letter-spacing:2px;margin-bottom:14px}
  #scroll p{font-size:15px;line-height:2;letter-spacing:.6px;margin:10px 0}
  #scroll .recall{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0}
  #scroll .recall div{background:rgba(90,70,40,.08);padding:8px 10px;font-size:12px;line-height:1.7;
    border-left:3px solid var(--zhu)}
  #scroll .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  #scroll button{font-family:inherit;cursor:pointer;padding:9px 18px;font-size:14px;letter-spacing:2px;
    background:var(--zhu);color:#f8f0de;border:none;border-radius:3px}
  #scroll button.ghost{background:transparent;color:var(--zhu);border:1px solid var(--zhu)}

  /* ---------- 标题/选出身 ---------- */
  #title{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
         background:radial-gradient(120% 90% at 50% 10%,#2a2230,#0f1016 70%);padding:18px}
  #title .box{width:min(1020px,96vw);max-height:92vh;overflow:auto;padding:26px 30px}
  #title .hd{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  #title h1{margin:0;font-size:30px;letter-spacing:10px;font-weight:600}
  #title .tag{font-size:13px;color:var(--ink2);letter-spacing:3px;margin-top:6px}
  #title .vseal{writing-mode:vertical-rl;font-size:13px;letter-spacing:4px;color:var(--zhu);
    border:2px solid var(--zhu);padding:8px 4px;line-height:1.4}
  #title .lead{font-size:14px;line-height:2;margin:14px 0 16px;letter-spacing:.5px;color:#413a31}
  .origins{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
  .origin{cursor:pointer;text-align:left;font-family:inherit;padding:14px 15px;border-radius:3px;
    background:linear-gradient(180deg,#f8f1e2,#e8dbc2);border:1px solid rgba(90,70,40,.4);
    transition:.14s;box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .origin:hover{transform:translateY(-2px);border-color:var(--zhu);box-shadow:0 8px 20px rgba(0,0,0,.28)}
  .origin h4{margin:0 0 2px;font-size:17px;letter-spacing:2px;color:var(--zhu)}
  .origin .who{font-size:12px;color:var(--ink2);letter-spacing:1px}
  .origin p{margin:8px 0 6px;font-size:12.5px;line-height:1.8;color:#4a4238}
  .origin .st{font-size:11.5px;color:#6b6155;letter-spacing:.5px}
  #title .foot{margin-top:14px;font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  #title .cont{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  #title .cont button{font-family:inherit;cursor:pointer;padding:8px 16px;font-size:13px;letter-spacing:2px;
    background:transparent;border:1px solid var(--zhu);color:var(--zhu);border-radius:3px}
  #title .cont button:hover{background:rgba(156,58,46,.08)}

  /* ---------- 图鉴 ---------- */
  #codexP{width:min(760px,94vw);z-index:34}
  #codexP h3 small{font-size:11px;color:var(--ink2);letter-spacing:2px;font-weight:400;margin-left:8px}
  #codexP .sub2{font-size:12px;color:var(--ink2);letter-spacing:2px;margin:14px 0 8px;
    border-bottom:1px dashed rgba(90,70,40,.28);padding-bottom:5px}
  #codexP .cx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #codexP .cx .c{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px;align-items:start;
    border:1px solid rgba(90,70,40,.22);background:rgba(255,255,255,.16)}
  #codexP .cx .c img{width:64px;height:86px;object-fit:contain;object-position:center bottom;
    background:radial-gradient(80% 70% at 50% 40%,#3a322a,#1a1714);border:1px solid rgba(90,70,40,.3)}
  #codexP .cx .c.lock img{filter:grayscale(1) brightness(.32) blur(2px)}
  #codexP .cx .nm{font-size:14px;letter-spacing:2px}
  #codexP .cx .tg{font-size:11px;color:var(--zhu);letter-spacing:1px;margin:2px 0 4px}
  #codexP .cx .ln{font-size:12px;line-height:1.7;color:#4a4238}
  #codexP .cx .hn{font-size:11px;line-height:1.6;color:#6b6155;margin-top:3px}
  #codexP .cx .c.lock .nm{color:#6b6155}
  #codexP .ends{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  #codexP .ends div{background:rgba(90,70,40,.08);padding:8px 10px;font-size:12px;line-height:1.7;
    border-left:3px solid var(--zhu)}
  #codexP .ends div.un{border-left-color:rgba(90,70,40,.25);color:#8a7d68}

  #toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:26;
    padding:9px 18px;font-size:14px;letter-spacing:1px;border-radius:3px;
    background:rgba(239,230,211,.96);border-left:4px solid var(--zhu);
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(4px)}
  #toast.down{border-left-color:#3c4d5a}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="clock" class="paper">
      <div class="row"><span id="date">正月初八</span><span id="slotname">清晨</span></div>
      <div class="bar"><i id="tbar"></i></div>
      <div id="today"></div>
    </div>
    <div id="attrs"></div>
  </div>

  <div id="hint"></div>

  <div id="dock">
    <button data-act="cast">好感<span>Tab</span></button>
    <button data-act="codex">图鉴</button>
    <button data-act="map">舆图<span>M</span></button>
    <button data-act="save">存档</button>
    <button data-act="load">读档</button>
    <button data-act="anim">减少动画</button>
  </div>

  <div id="dlg" class="hidden">
    <div id="dbox" class="paper">
      <div id="dhead"><b id="dName"></b><span id="dMeta"></span></div>
      <div id="dText"></div>
      <div id="dChoices"></div>
      <div id="dNext">▸ 空格</div>
    </div>
  </div>

  <div id="cast" class="panel paper hidden"></div>
  <div id="mapP" class="panel paper hidden"></div>
  <div id="codexP" class="panel paper hidden"></div>
  <div id="card" class="paper hidden"></div>
  <div id="ending" class="hidden"></div>
  <div id="toast"></div>

  <div id="title">
    <div class="box paper">
      <div class="hd">
        <div>
          <h1>市井浮生</h1>
          <div class="tag">东京梦华 · 政和年间 · 汴梁</div>
        </div>
        <div class="vseal">宣和遗事<br>前编</div>
      </div>
      <p class="lead">
        「举目则青楼画阁，绣户珠帘……八荒争凑，万国咸通。」<br>
        你带着最后一点盘缠进了这座城。房钱每日二十文，一碗热羹十文，
        而这座城要的东西，从来不止钱。<br>
        <span style="color:#9c3a2e">八日之后是上元。到那一夜，你得决定替谁出头、又放弃谁。</span>
      </p>
      <div class="origins" id="origins"></div>
      <div class="cont" id="cont"></div>
      <div class="foot">
        <span>WASD / 方向键 行走　E 或 空格 交互　Tab 好感　M 舆图　Esc 关闭</span>
        <span>F：减少动画　存档在本地浏览器</span>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="intro.js"></script>
<script src="engine.js"></script>
</body>
</html>
